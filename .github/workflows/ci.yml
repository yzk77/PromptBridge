name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ChineseToChatGPT.sln

      - name: Build
        run: dotnet build ChineseToChatGPT.sln -c Release --no-restore

      - name: Test
        run: dotnet run --project tests/ChineseToChatGPT.Tests/ChineseToChatGPT.Tests.csproj -c Release --no-build
